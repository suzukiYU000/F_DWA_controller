controller_server:
  ros__parameters:
    FollowPath:
      # Unmodified Nav2 DWB baseline. Unlike V-DWA, the dynamic-window origin
      # is the odometry velocity supplied by Controller Server.
      plugin: "dwb_core::DWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::LimitedAccelGenerator"
      sim_period: 0.05
      # Canonical Navigation2 DWB critic family. The standard polygon
      # footprint critic is included because this WHILL is not circular.
      critics:
        - RotateToGoal
        - ObstacleFootprint
        - BaseObstacle
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
      RotateToGoal.class: "dwb_critics::RotateToGoalCritic"
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      ObstacleFootprint.class: "dwb_critics::ObstacleFootprintCritic"
      ObstacleFootprint.scale: 0.0125
      ObstacleFootprint.sum_scores: true
      BaseObstacle.class: "dwb_critics::BaseObstacleCritic"
      # R1 retained at least 54 legal candidates while a stationary candidate
      # won the summed 2.4 s inflation cost.  Preserve hard footprint collision
      # rejection and reduce only this soft ranking term.
      BaseObstacle.scale: 0.003125
      BaseObstacle.sum_scores: true
      PathAlign.class: "dwb_critics::PathAlignCritic"
      PathAlign.scale: 32.0
      # At the strict-map room entrance, a 0.325 m projection remains only
      # 0.016 m from the path, below one 0.05 m costmap cell.  A 0.6 m
      # projection retains a measurable 0.086 m alignment error through the
      # turn without changing the native DWB critic implementation.
      PathAlign.forward_point_distance: 0.6
      GoalAlign.class: "dwb_critics::GoalAlignCritic"
      GoalAlign.scale: 24.0
      # Evaluate both native alignment critics at the same forward reference.
      GoalAlign.forward_point_distance: 0.6
      PathDist.class: "dwb_critics::PathDistCritic"
      PathDist.scale: 32.0
      GoalDist.class: "dwb_critics::GoalDistCritic"
      GoalDist.scale: 24.0

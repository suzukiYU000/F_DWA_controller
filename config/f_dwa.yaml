controller_server:
  ros__parameters:
    FollowPath:
      plugin: "f_dwa_controller::FDwaController"
      trajectory_generator_name: "f_dwa_controller::FirTrajectoryGenerator"
      enable_certification: true
      native_input_control_period: 0.03
      applied_command_topic: "/controller/applied_cmd_vel"
      require_applied_command_state: true
      native_state_reset_velocity_threshold: 0.01
      max_linear_raw_input: 1.2
      max_angular_raw_input: 1.57

      # F-8 default: exact coefficients from the named ROS 1
      # advanced_dwa/profiles/f-8.yaml.
      #
      # Design evidence:
      #   mode: lowpass
      #   original_numtaps: 91
      #   cutoff_hz: 1.2
      #   window: hamming
      #   minimum_phase: true
      #
      # Existing ROS 1 profile change patterns:
      #   F-7: cutoff_hz 0.5, otherwise the same design family; replace the
      #        complete vector with advanced_dwa/profiles/f-7.yaml.
      #   F-9: cutoff_hz 2.0, otherwise the same design family; replace the
      #        complete vector with advanced_dwa/profiles/f-9.yaml.
      #
      # Paper-design change pattern:
      #   Keep this file and replace this complete vector with the frozen
      #   paper-design coefficient vector. Record its mode, original_numtaps,
      #   bands/stopbands, window, minimum_phase, DC gain, and fingerprint in

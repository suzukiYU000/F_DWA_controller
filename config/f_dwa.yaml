controller_server:
  ros__parameters:
    FollowPath:
      plugin: "f_dwa_controller::InstrumentedController"
      primary_controller_type: "f_dwa_controller::FDwaController"
      trajectory_generator_name: "f_dwa_controller::FirTrajectoryGenerator"
      enable_certification: false
      native_input_control_period: 0.05
      require_applied_command_state: true
      max_linear_raw_input: 1.2
      max_angular_raw_input: 1.57
      # The two-cycle pulse is the shortest setting that completed the fixed
      # entrance replay. A longer pulse overstates the future FIR turn while
      # only its first step is executed, allowing turn initiation to be
      # deferred on every cycle. Terminal-stop certification is independent.
      fir_prediction_pulse_duration: 0.10
      # fir_prediction_pulse_duration: 0.15  # historical ROS 1 pulse ablation

      # Python generates coefficients before Nav2 starts. A 1.2 Hz cutoff
      # preserves the former F8 design at the established 20 Hz design rate.
      fir_cutoff_frequency_hz: 1.2

      # Existing ROS 1 design-family change patterns. A wider allowed motion
      # band remains an ablation rather than an assumed agility improvement.
      # In the 2026-07-30 ground-truth Env2 diagnostic, f9 was slower than f8.
      # fir_cutoff_frequency_hz: 0.5  # former F7: strongest smoothing
      # fir_cutoff_frequency_hz: 2.0  # former F9: widest-band profile
      #
      # Paper-design change pattern:
      # fir_design_profile: "paper"
      # Add its taps, sample frequency, attenuation bands, phase conversion,
      # and window atomically to FIR_FILTER_DESIGNS in fir_filter_design.py.

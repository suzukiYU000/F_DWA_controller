controller_server:
  ros__parameters:
    FollowPath:
      plugin: "f_dwa_controller::FDwaController"
      trajectory_generator_name: "f_dwa_controller::FirTrajectoryGenerator"
      enable_certification: true
      native_input_control_period: 0.03
      require_applied_command_state: true
      max_linear_raw_input: 1.2
      max_angular_raw_input: 1.57

      # Python generates coefficients before Nav2 starts. The named f8 design
      # preserves the ROS 1 profile, including its 20 Hz design sample rate.
      fir_design_profile: "f8"

      # Existing ROS 1 design-family change patterns:
      # fir_design_profile: "f7"  # 0.5 Hz low-pass cutoff
      # fir_design_profile: "f9"  # 2.0 Hz low-pass cutoff
      #
      # Paper-design change pattern:
      # fir_design_profile: "paper"
      # Add its taps, sample frequency, attenuation bands, phase conversion,
      # and window atomically to FIR_FILTER_DESIGNS in fir_filter_design.py.

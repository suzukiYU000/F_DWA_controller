controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.6
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 0.6
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 1.0
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      # Preserve the upstream RPP curvature regulation: at the requested
      # 0.6 m/s, a 1.0 m scaling radius bounds curved motion to 0.6 rad/s.
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      # R1's NavFn path leaves the start at about -0.62 rad while the test pose
      # is 0.042 rad. The former 0.785 threshold made RPP drive the initial arc
      # and report collision after 0.09 m; rotate onto the path before driving.
      rotate_to_heading_min_angle: 0.5
      max_angular_accel: 1.57
      allow_reversing: false
      stateful: true

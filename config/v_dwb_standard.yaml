controller_server:
  ros__parameters:
    FollowPath:
      plugin: "f_dwa_controller::CertifiedDWBLocalPlanner"
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      enable_certification: true
      # StandardTrajectoryGenerator otherwise returns the distant target
      # velocity rather than its first acceleration-limited executable sample.
      limit_vel_cmd_in_traj: true

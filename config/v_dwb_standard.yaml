controller_server:
  ros__parameters:
    FollowPath:
      plugin: "f_dwa_controller::InstrumentedController"
      primary_controller_type: "f_dwa_controller::CertifiedDWBLocalPlanner"
      trajectory_generator_name: "f_dwa_controller::VStandardTrajectoryGenerator"
      enable_certification: false
      # StandardTrajectoryGenerator otherwise returns the distant target
      # velocity rather than its first acceleration-limited executable sample.
      limit_vel_cmd_in_traj: true

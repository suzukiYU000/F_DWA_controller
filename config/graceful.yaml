controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_graceful_controller::GracefulController"
      transform_tolerance: 0.2
      min_lookahead: 0.25
      # The 1.0 m carrot cut across the R1 room-entry corner and Graceful's
      # native collision check rejected it. Keep that check and follow the
      # known-free NavFn bend with a shorter maximum carrot.
      max_lookahead: 0.5
      k_phi: 2.0
      k_delta: 1.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.6
      v_angular_max: 0.6
      v_angular_min_in_place: 0.1
      slowdown_radius: 1.5
      initial_rotation: true
      initial_rotation_tolerance: 0.75
      prefer_final_rotation: true
      rotation_scaling_factor: 0.5
      allow_backward: false
      in_place_collision_resolution: 0.05

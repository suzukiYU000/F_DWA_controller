controller_server:
  ros__parameters:
    # Nav2 Controller Server's upstream default is 20 Hz. Keep every
    # comparison controller at this rate; the delayed robot-facing transport
    # has its own faster 33.333 Hz Timer.
    controller_frequency: 20.0
    # Nav2 raises only the FollowPath action thread to soft RT priority 90.
    # This reduces scheduling jitter near the 50 ms deadline without changing
    # any candidate, critic, motion limit, or safety certificate.  The Docker
    # services grant rtprio up to 99 as required by Nav2.
    use_realtime_priority: true
    enable_stamped_cmd_vel: false
    odom_topic: "/whill/odom"
    # Keep Nav2 Controller Server unmodified. The robot-facing transport owns
    # the 33.333 Hz Timer, preserves upstream commands in a bounded FIFO, and
    # validates FIFO-empty/applied-zero after the standard FollowPath result.
    publish_zero_velocity: true
    controller_plugins: ["FollowPath"]
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    general_goal_checker:
      # The comparison evaluates terminal position and stopped velocity.
      # A shortest angular distance never exceeds pi, so yaw cannot prevent
      # success while angular velocity must still settle below 0.01 rad/s.
      yaw_goal_tolerance: 3.141592653589793
      xy_goal_tolerance: 0.25
    FollowPath:
      debug_trajectory_details: true
      # Match the GoalChecker position window.  A smaller stopping window left
      # a 0.20--0.25 m band where Nav2 could accept the position but the common
      # critic would not settle angular velocity.
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.01
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.6
      max_vel_y: 0.0
      max_vel_theta: 0.6
      min_speed_xy: 0.0
      max_speed_xy: 0.6
      min_speed_theta: 0.0
      acc_lim_x: 1.2
      acc_lim_y: 0.0
      acc_lim_theta: 1.57
      decel_lim_x: -1.2
      decel_lim_y: 0.0
      decel_lim_theta: -1.57
      vx_samples: 11
      vy_samples: 1
      # Use the same angular candidate count for every DWB-derived method.
      # Fifteen improves steering resolution without changing the upstream
      # generator algorithms or introducing a method-specific advantage.
      vtheta_samples: 15
      # The 2026-08-07 doorway runs showed one-cycle 165/165 footprint
      # rejection with only a 0.6 m maximum rollout. A common 1.6 s horizon
      # exposes up to 0.96 m while keeping J-DWA's first executable velocity
      # increment above the common 0.001 m/s threshold.
      sim_time: 1.6
      # Keep the transformed Path longer than the maximum 0.6 m/s x 1.6 s
      # nominal rollout. The 4 m segment remains inside the 5 m half-width of
      # the common local costmap and prevents a candidate from being scored
      # against an artificially clipped Path endpoint.
      forward_prune_distance: 4.0
      # Keep enough path behind the closest point to recover from the largest
      # measured real-machine deviation (2.24 m). This prevents DWB from
      # pruning the transformed path to zero and publishing an abrupt stop
      # while the endpoint-admissible controller is decelerating or returning.
      prune_distance: 4.0
      discretize_by_time: true
      time_granularity: 0.05
      linear_granularity: 0.05
      angular_granularity: 0.025
      include_last_point: true
      enable_nominal_delay_preview: true
      # Standard DWA starts each dynamic window from measured odometry. Keep
      # dispatch/native ledgers for known future transport and A/J/F state, but
      # do not assume that the physical WHILL has already reached the last
      # robot-facing command.
      use_observed_velocity_for_activation_state: true
      # Both modes enable this common plant model in launch. The parameters
      # were identified from post-Collision-Monitor command and odometry data
      # in run_20260823_221202/run_20260823_221327 and independently validated
      # by run_20260825_163606/run_20260825_163730. Simulation also applies the
      # same response before Gazebo, so candidate activation and plant motion
      # use one model rather than mode-specific dynamics.
      enable_velocity_response_prediction: false
      velocity_response_prediction_seconds: 0.12
      velocity_response_integration_step_seconds: 0.01
      linear_velocity_response_dead_time_seconds: 0.035
      linear_velocity_response_time_constant_seconds: 0.02
      linear_velocity_response_gain: 1.0
      angular_velocity_response_dead_time_seconds: 0.015
      angular_velocity_response_time_constant_seconds: 0.085
      angular_velocity_response_gain: 0.95
      # This value is the measured transport bound. The planner adds its
      # configured 50 ms computation deadline when predicting the candidate
      # activation pose, so a qualified command begins at a 120 ms preview.
      nominal_delay_preview_seconds: 0.07
      # This is a robot-observable software dispatch event. It does not claim
      # knowledge of the internal motor actuation instant.
      command_dispatch_topic: "/controller/command_dispatch"
      transport_valid_topic: "/dwa_experiment/transport_valid"
      transport_invalidation_service: "/command_delay_transport/invalidate_trial"
      require_command_dispatch_state: true
      # Real launch enables this only for a same-sequence, FIFO-head command
      # reduction observed after Collision Monitor. Simulation keeps strict
      # value equality so transport corruption cannot masquerade as safety.
      allow_safety_command_reduction: false
      certification_control_period: 0.05
      # When every complete prediction is invalid, reevaluate this method's
      # current native candidates and dispatch only the first native response.
      # Its physical footprint must stay strictly collision-free for the 50 ms
      # planning deadline plus one 50 ms command-hold interval. Prefer later
      # predicted collision, then lower fused-clearance risk and weighted
      # PathDeviation cost, and replan on the next cycle. This exceptional
      # one-step viability action is used only when no complete stop-admissible
      # rollout exists; it is never promoted to a legal full trajectory. The
      # legacy parameter name is retained for launch/API compatibility;
      # ordinary deceleration suffixes are no longer retained.
      enable_no_valid_control_deceleration_fallback: true
      # Standard Dynamic Window admissibility: a candidate may be selected
      # only when issuing it now and then applying that method's native
      # deceleration can stop the physical WHILL footprint without entering a
      # lethal/unknown cell. This uses no extra certificate reserve and is
      # common to V/A/J/F, so faster ranking cannot consume the last braking
      # room before an obstacle.
      enable_stop_admissibility: true
      # Enter hierarchical avoidance only when the live sensor layer contains
      # risk not explained by the static map. Once active, preserve
      # direction-aware forward clearance ahead of path rejoining; use the
      # conservative union of static-map and live-sensor footprint clearance
      # as the secondary rank. Known narrow entrances therefore remain
      # weight-driven, while an unknown blocker activates avoidance early.
      # Hard swept-footprint and complete-stop gates remain active.
      enable_clearance_constraint: true
      clearance_constraint_critic_name: "DynamicClearance"
      clearance_constraint_trigger_critic_name: "DynamicClearance"
      # Once live-only risk activates avoidance, first keep the conservative
      # master footprint exposure within the empirically separated feasible
      # band (south bypass 0.374 versus blocked north side 0.443), then reduce
      # the live-only footprint risk ahead of path rejoining.
      clearance_constraint_guard_critic_name: "FootprintClearance"
      # Absolute master-map risk must not suppress a mapped narrow entrance.
      # Activate only for a large predicted increase within the executable
      # prefix, before a post-bypass wall approach can exhaust every J-DWA
      # candidate. Constant narrowness remains weight-driven.
      clearance_constraint_include_footprint_approach: true
      clearance_constraint_footprint_approach_trigger_risk: 0.50
      clearance_constraint_guard_admissible_risk: 0.30
      clearance_constraint_guard_risk_resolution: 0.005
      # Once avoidance is active, treat live-only risk at or below this
      # ranking threshold as admissible; above it, reduce unknown-obstacle
      # exposure before the weighted objective. The master-footprint guard
      # above still prevents this preference from choosing a statically
      # blocked bypass.
      clearance_constraint_admissible_risk: 0.10
      # In Sim152727 the safe entrance turn measured ForwardObstacle=0.256,
      # while the fused all-around clearance was 0.924 and unnecessarily
      # suppressed future acceleration. Keep that case weight-driven; enter
      # hierarchical avoidance only for a stronger forward encounter.
      clearance_constraint_trigger_risk: 0.10
      # Compare unavoidable dynamic-risk violations in half-percent bands.
      # This separates the 0.563 and 0.568 candidates available in one V-DWA
      # dynamic window while still grouping sub-resolution sensor noise.
      clearance_constraint_risk_resolution: 0.005
      # Keep the ordinary risk/weighted ranking unchanged. If the selected
      # translational command has stalled while live obstacle risk
      # remains active, allow a hard-legal, stop-admissible
      # native response that moves toward the observable Path subgoal or turns
      # toward its bearing. Evaluate progress over the complete method-native
      # stop sequence, so F-DWA's delayed FIR turn is not misclassified from
      # its near-zero first output. One half costmap cell and one angular
      # discretization step are sufficient evidence of progress.
      clearance_constraint_minimum_subgoal_distance_progress: 0.025
      clearance_constraint_minimum_subgoal_heading_progress: 0.025
      clearance_constraint_motion_preference_goal_distance: 0.75
      # F-8's 46 effective taps retain 2.3 s of raw-input history at 20 Hz.
      # Twelve seconds lets the projected stop drain that state after braking;
      # this is only a search bound, and the generated sequence ends as soon
      # as velocity, acceleration, and applicable input history are captured.
      terminal_stop_maximum_time: 12.0
      # The same capture magnitude applies to internally tracked acceleration
      # and F-DWA raw-input history before terminal state is cleared.
      terminal_stop_velocity_threshold: 0.01
      # Score whether the already-generated certified stop trajectory reaches
      # 1.5 m of forward Path progress. Overshoot is not penalized here;
      # nominal-trajectory critics retain lateral tracking responsibility.
      # This adds no second trajectory search and keeps safety as a separate
      # swept-footprint rejection.
      terminal_stop_goal_distance_scale: 24.0
      terminal_stop_distance_target: path_progress
      terminal_stop_path_lookahead_distance: 1.5
      # Once a method-native predicted stop ends inside the GoalChecker's
      # position window, retain and revalidate that deceleration suffix. This
      # prevents a fast trajectory from crossing and pruning away the final
      # Path point before the stopped GoalChecker can accept it.
      # Keep a 1 cm settling reserve inside the unchanged 0.25 m GoalChecker
      # window. Simulation trials U06/U10 otherwise latched rotation after
      # crossing the boundary and settled 0.26--0.34 mm outside it; the same
      # model/tracking mismatch must be expected on hardware.
      terminal_stop_goal_capture_distance: 0.24
      # Ignore terminal yaw when retaining a certified stop. The periodic yaw
      # error is at most pi, matching the position-and-speed GoalChecker.
      terminal_stop_goal_capture_yaw_tolerance: 3.141592653589793
      stop_capture_velocity: 0.01
      # Shared measured response horizon for simulation and the physical WHILL.
      # Certification rounds 120 ms upward to three 50 ms controller ticks.
      terminal_stop_command_delay_seconds: 0.12
      # Reserve one local-costmap cell outside the measured physical footprint
      # when certifying the complete stop. The 0.02 m reserve still allowed the
      # delayed F-DWA response to consume all stopping room at the mapped
      # doorway in the Real203039 and Real203249 regression simulations.
      minimum_certified_margin: 0.05
      # Optional reserve-only recovery never relaxes the physical
      # planning footprint. It is an ablation and remains off for the primary
      # comparison; when enabled, the candidate must move toward and clear
      # only the additional 0.05 m reserve.
      enable_reserve_recovery: false
      reserve_recovery_hysteresis: true
      # Costmap cells quantize a measured obstacle to a 0.05 m square. At the
      # doorway this can put one voxel-layer cell across the rasterized edge of
      # the measured footprint even when its center remains outside the body.
      # Keep the measured footprint as the normal hard gate. Only when every
      # pose of a candidate is safe for the 0.05 m inset core may a boundary
      # overlap at the current pose or the first 50 ms response be considered.
      # Entry after that first response remains a hard rejection. This
      # accommodates the rear corner sweep while escaping nearly parallel to a
      # wall without imposing a clear-by deadline that can reject a safe stop.
      # After clearing the strip, a candidate cannot enter it again.
      # Unknown space and a core collision remain hard failures. The finite
      # penalty makes every normal physical-footprint-safe candidate preferable
      # in ordinary score ranges.
      enable_initial_overlap_recovery: true
      initial_overlap_footprint_inset: 0.05
      initial_overlap_recovery_penalty: 1000000.0
      # At 0.05 m costmap resolution, checking at half-cell swept distance
      # prevents translation plus rectangle-corner rotation from skipping a cell.
      maximum_swept_distance: 0.025
      # Batch search keeps controller_server alive. Call this service once at
      # each run boundary; configured FIR coefficients are retained.
      trial_reset_service_name: "~/FollowPath/reset_trial_state"
      transform_tolerance: 0.2
      # All configured critic scores are non-negative. This only skips critic
      # work for candidates that cannot beat the best certified candidate.
      short_circuit_trajectory_evaluation: true
      # Keep canonical candidate order for the primary fair comparison.
      prefer_previous_selected_candidate: false
      # prefer_previous_selected_candidate: true  # performance-only ablation
      planning_metrics_enabled: true
      planning_metrics_report_interval: 1000
      planning_deadline_seconds: 0.05
      # Candidate evaluation is diagnostic output, not a control input.
      # One complete candidate set every five seconds is sufficient for the
      # post-run cost diagnosis. R28d showed that 0.5 Hz could invalidate both
      # the run and its automatic retry through rosbag loss, while 0.2 Hz
      # recorded the same control outcome with zero loss. Candidate generation
      # and scoring still run on every controller tick.
      # The simulation launch overrides this fallback to 10 Hz only when the
      # separate candidate-animation diagnostic mode is explicitly enabled.
      publish_evaluation: true
      evaluation_publish_frequency: 0.2
      publish_trajectories: false
      stateful: true
      critics:
        # Evaluate the physical hard constraint before soft short-circuiting,
        # so every trajectory reported as valid has passed the footprint gate.
        - ObstacleFootprint
        - PathDeviation
        - RotateToGoal
        - TerminalApproach
        - GoalAlign
        - PathAlign
        - MeanPathDist
        - GoalDist
        # These two research critics restore the progress and predicted-speed
        # terms used by the earlier evaluator without reading simulator-only
        # obstacle state. They are identical for V/A/J/F.
        - TrajectoryProgress
        - MeanSpeed
        # Softly expose whether the endpoint heading leaves observable room
        # for the next receding-horizon cycle. This never replaces or relaxes
        # the common swept-footprint SafetyCertificate.
        - ForwardObstacle
        # Live-only footprint risk activates avoidance without treating a
        # mapped narrow entrance as an unknown blocker. It has zero weighted
        # cost; ForwardObstacle and fused FootprintClearance rank candidates.
        - DynamicClearance
        # Soft footprint-aware clearance ranking over the complete
        # method-native stop sequence. This observes braking and angular
        # inertia without changing the physical footprint, speed limits or
        # hard collision rejection. The GUI exposes the same common margin for
        # V/A/J/F/DWB comparisons.
        # StaticClearance remains configured below for offline ablations.
        - FootprintClearance
        # The common certification layer performs exact swept-footprint safety
        # checks. Use the standard center-cell critic only for the continuous
        # inflation gradient used in candidate ranking.
        - BaseObstacle
      # R1 diagnostics found valid, collision-free moving candidates at the
      # room approach, but the 2.4 s accumulated inflation gradient made the
      # stationary candidate cheapest until PoseProgressChecker expired.
      # Keep the polygon hard-rejection critic unchanged and reduce only this
      # soft center-cell ranking term. Preserve the former 1.0 s integrated
      # exposure after the horizon increase: 0.005 * 1.0 / 1.6.
      BaseObstacle.scale: 0.003125
      # BaseObstacle.scale: 0.15  # stronger-clearance ablation; recording invalid
      BaseObstacle.sum_scores: true
      # Common V/A/J/F soft corridor: one predicted point beyond 1.5 m adds the
      # fixed finite cost 1000; all points at or inside 1.5 m add zero. It never
      # rejects a trajectory, so the minimum-cost candidate remains selectable
      # if every candidate is outside. MeanPathDist below remains the separate
      # continuous average-distance term.
      PathDeviation.class: "f_dwa_controller::PathDeviationCritic"
      PathDeviation.maximum_path_distance: 1.5
      PathDeviation.deviation_penalty: 1000.0
      PathDeviation.scale: 1.0
      # Keep the heading/path observation terms identical to the passing Nav2
      # DWB baseline.  R1 evidence showed that the former research-only values
      # (PathAlign 2.0, GoalAlign 1.5, 0.325 m) underweighted the north-room
      # bend: V/A/J reversed a small positive turn and stopped at the doorway,
      # while baseline DWB selected about +0.28 rad/s before the same bend.
      # These are critic parameters only; each method's dynamics remain native.
      PathAlign.scale: 32.0
      PathAlign.class: "f_dwa_controller::LinearPathAlignCritic"
      PathAlign.forward_point_distance: 0.6
      GoalAlign.scale: 24.0
      GoalAlign.class: "f_dwa_controller::LinearGoalAlignCritic"
      GoalAlign.forward_point_distance: 0.6
      MeanPathDist.class: "f_dwa_controller::MeanPathDistCritic"
      # Match the upstream DWB path-distance exposure. The former value 80
      # charged a 0.5 m doorway detour about 20 cost while the entire forward
      # obstacle signal was capped at 2, making an exact stop cheaper than a
      # safe path departure in run05.
      MeanPathDist.scale: 32.0
      GoalDist.class: "f_dwa_controller::LinearGoalDistCritic"
      GoalDist.scale: 24.0
      TrajectoryProgress.class: "f_dwa_controller::TrajectoryProgressCritic"
      # 0.6 m/s x 1.6 s. Near the goal, the critic automatically uses the
      # shorter remaining Path length.
      TrajectoryProgress.lookahead_distance: 0.96
      # Keep progress at the previously validated value. In
      # run_20260823_204411 at the first bend, candidate 111 was in the same
      # hard-legality and 0.01 clearance-risk bucket as selected candidate 22,
      # but its 0.600 m/s mean speed lost by only 0.848 total cost to a
      # 0.379 m/s candidate. Raising only the common speed term from 9 to 13
      # reverses that pair by 0.036 without weakening obstacle legality or
      # clearance ordering.
      TrajectoryProgress.scale: 25.0
      MeanSpeed.class: "f_dwa_controller::MeanSpeedCritic"
      MeanSpeed.target_speed: 0.6
      MeanSpeed.scale: 13.0
      ForwardObstacle.class: "f_dwa_controller::ForwardObstacleCritic"
      # Use the measured 5 m sensor/local-costmap visibility while retaining
      # one metre of range reserve. J/F-DWA need this earlier direction-aware
      # signal to preserve a smooth detour instead of rejoining the blocked
      # reference path before the former 2.5 m probe could see the obstacle.
      # This remains independent of sim_time and does not relax the hard swept
      # footprint or complete-stop certificates.
      ForwardObstacle.risk_distance: 4.0
      # Build every soft risk path from the same native-model prefix. Longer
      # 1.6/1.8 s rollout suffixes remain available to the physical hard gate,
      # but cannot change this 2.5 m terminal-value prediction.
      # Keep the complete default Controller prediction before extending the
      # candidate along the Path. Launch overrides this with the GUI-selected
      # prediction time so gradual V-DWA steering remains observable.
      ForwardObstacle.risk_seed_time: 2.5
      # After the common 1.4 s native prefix, preserve the candidate's spatial
      # turn for a fixed 0.50 m maneuver phase, then merge its heading back to
      # the plan over this common physical distance. The complete 0.50 + 1.0 m
      # transition fits beyond a 0.84 m maximum-speed seed in the 4.0 m risk
      # horizon and is independent of sim_time.
      ForwardObstacle.heading_relaxation_distance: 1.0
      ForwardObstacle.sample_resolution: 0.05
      # Weight a hit near the candidate endpoint more than the same hit at the
      # end of the observable extension. This removes the former binary
      # saturation where every slight turn scored exactly 1.0 until it had
      # already cleared the obstacle completely.
      ForwardObstacle.distance_weighting_power: 1.0
      # Blend a peak guard with the fixed-distance exposure integral.  A pure
      # maximum gives every ray that touches one inflated obstacle nearly the
      # same score and cannot initiate an early detour.
      ForwardObstacle.peak_weight: 0.25
      ForwardObstacle.scale: 8.0
      # Dynamic-only risk starts the epsilon-constraint mode but has zero
      # weighted cost. StaticClearance supplies a separate known-wall guard,
      # while the bounded FootprintClearance cost remains in the ordinary DWB
      # objective.
      DynamicClearance.class: "f_dwa_controller::FootprintClearanceCritic"
      DynamicClearance.clearance_margin: 0.45
      DynamicClearance.clearance_bands: 9
      DynamicClearance.risk_distance: 4.0
      DynamicClearance.risk_seed_time: 2.5
      DynamicClearance.heading_relaxation_distance: 1.0
      DynamicClearance.sample_resolution: 0.10
      DynamicClearance.source_layer: ""
      # In the 2026-08-25 real-fidelity replay, 703/704 live lethal cells in a
      # no-obstacle frame were within 0.15 m of a mapped wall; the maximum
      # registration/rasterization offset was 0.178 m. Round that measured
      # bound to 0.18 m, rather than 0.20 m: the latter hid the 0.20 m
      # simulation/world mismatch that caused two NoValidControl zeros in the
      # Real202818 replay. Hard collision rejection and the master-costmap
      # soft-clearance objective still retain every sensor return.
      DynamicClearance.exclude_layer: "static_layer"
      DynamicClearance.exclude_layer_tolerance: 0.18
      DynamicClearance.apply_exclude_tolerance_on_aligned_grids: true
      DynamicClearance.penalty_power: 3.0
      DynamicClearance.peak_weight: 0.25
      DynamicClearance.scale: 0.0
      # V/J-DWA load this zero-weight master-map view as their avoidance rank.
      # DynamicClearance remains the live-only trigger, while this combined
      # static + live field prevents the velocity or jerk window from reducing
      # obstacle risk by committing to a mapped wall. F-DWA retains its
      # input-history-aware DynamicClearance rank.
      MasterClearance.class: "f_dwa_controller::FootprintClearanceCritic"
      MasterClearance.clearance_margin: 0.45
      MasterClearance.clearance_bands: 9
      MasterClearance.risk_distance: 4.0
      MasterClearance.risk_seed_time: 2.5
      MasterClearance.heading_relaxation_distance: 1.0
      MasterClearance.sample_resolution: 0.10
      MasterClearance.source_layer: ""
      MasterClearance.exclude_layer: ""
      MasterClearance.exclude_layer_tolerance: 0.0
      MasterClearance.apply_exclude_tolerance_on_aligned_grids: false
      MasterClearance.penalty_power: 3.0
      MasterClearance.peak_weight: 0.25
      MasterClearance.scale: 0.0
      # Static-only risk is evaluated solely as the avoidance-context guard.
      # It never contributes weighted cost and cannot activate the constraint
      # at an ordinary mapped doorway.
      StaticClearance.class: "f_dwa_controller::FootprintClearanceCritic"
      StaticClearance.clearance_margin: 0.45
      StaticClearance.clearance_bands: 9
      StaticClearance.risk_distance: 2.5
      StaticClearance.risk_seed_time: 2.5
      StaticClearance.heading_relaxation_distance: 1.0
      StaticClearance.sample_resolution: 0.10
      StaticClearance.source_layer: "static_layer"
      StaticClearance.exclude_layer: ""
      StaticClearance.exclude_layer_tolerance: 0.0
      StaticClearance.apply_exclude_tolerance_on_aligned_grids: false
      StaticClearance.penalty_power: 3.0
      StaticClearance.peak_weight: 0.25
      StaticClearance.scale: 0.0
      # This bounded soft term keeps useful clearance from mapped walls. Read
      # the fixed static layer directly: DynamicClearance already owns the
      # independently ranked live-obstacle field, so rebuilding their union on
      # the rolling master grid would duplicate the distance transform every
      # Controller cycle. It is deliberately weaker than path/goal alignment:
      # on Real203039 and
      # Real203249, scale 75 assigned roughly 52 cost to the correct doorway
      # turn and selected the opposite steering direction for five seconds.
      # Dynamic obstacles use the independent epsilon constraint above.
      FootprintClearance.class: "f_dwa_controller::FootprintClearanceCritic"
      FootprintClearance.clearance_margin: 0.45
      FootprintClearance.clearance_bands: 9
      FootprintClearance.risk_distance: 2.5
      FootprintClearance.risk_seed_time: 2.5
      FootprintClearance.heading_relaxation_distance: 1.0
      FootprintClearance.sample_resolution: 0.10
      FootprintClearance.source_layer: "static_layer"
      FootprintClearance.exclude_layer: ""
      FootprintClearance.exclude_layer_tolerance: 0.0
      FootprintClearance.apply_exclude_tolerance_on_aligned_grids: false
      FootprintClearance.penalty_power: 3.0
      FootprintClearance.peak_weight: 0.25
      # A full-scale static-clearance difference contributes at most 8 cost.
      # Physical collision and complete-stop admissibility remain hard gates.
      FootprintClearance.scale: 8.0
      ObstacleFootprint.class: "f_dwa_controller::HorizonObstacleFootprintCritic"
      # Deprecated compatibility input: this value is still validated but no
      # longer truncates the hard gate or contributes a soft score. The critic
      # checks the complete nominal rollout and returns raw zero when legal;
      # ForwardObstacle, FootprintClearance and BaseObstacle provide ranking.
      ObstacleFootprint.score_time_horizon: 1.6
      # Spatial interpolation interval for swept physical-footprint checks.
      # A longer sim_time still checks a longer suffix and can therefore
      # change the hard legal candidate set.
      ObstacleFootprint.maximum_swept_distance: 0.025
      # Keep a non-zero scale for configuration/provenance compatibility;
      # every legal candidate has neutral raw score zero.
      ObstacleFootprint.scale: 0.4
      RotateToGoal.scale: 32.0
      RotateToGoal.class: "f_dwa_controller::HysteresisRotateToGoalCritic"
      RotateToGoal.slowing_factor: 5.0
      # Preserve the stopping behavior without ranking the configured goal
      # orientation. Angular motion is instead reduced around the current yaw.
      RotateToGoal.ignore_goal_orientation: true
      # Once the robot enters the GoalChecker window, keep terminal braking
      # latched until the critic is reset for a new Path. Releasing immediately
      # after a high-speed crossing allowed the controller to accelerate away
      # from the final Path point before the stopped GoalChecker could accept.
      RotateToGoal.xy_goal_tolerance_release_margin: -1.0
      RotateToGoal.lookahead_time: 1.25
      TerminalApproach.class: "f_dwa_controller::TerminalApproachCritic"
      # Keep obstacle/path ranking unchanged outside the stopping envelope.
      # The launch/runtime layer replaces 1.5 m with
      # v_max^2/(2*0.15) + 0.07*v_max + 0.25; at 0.8 m/s this is 2.439 m.
      # The smooth transition avoids a discontinuous command choice.
      # Every horizon evaluates the same 1.4 s rollout prefix and projects its
      # measured speed from that pose to a soft predicted stopping position.
      TerminalApproach.evaluation_time: 1.4
      TerminalApproach.outer_distance: 1.5
      TerminalApproach.full_weight_distance: 0.65
      # Recorded V/A/J/F stopping responses, including their native state
      # dynamics and past-command transport, were 0.109--0.163 m/s^2.  Using
      # the physical 0.6 m/s^2 value underestimated the observed stopping
      # distance by four to six times and activated useful ranking too late.
      TerminalApproach.reference_deceleration: 0.15
      # The progress and mean-speed terms were doubled after the recorded
      # low-speed run. Preserve the prior terminal/forward objective ratio so
      # that extra progress does not overpower a stop-capable candidate.
      TerminalApproach.scale: 48.0

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.6, 0.0, 0.6]
    min_velocity: [0.0, 0.0, -0.6]
    max_accel: [1.2, 0.0, 1.57]
    max_decel: [-1.2, 0.0, -1.57]
    odom_topic: "/whill/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
    cmd_vel_in_topic: "cmd_vel_collision_unused_input"
    cmd_vel_out_topic: "cmd_vel_collision_unused"

local_costmap:
  local_costmap:
    ros__parameters:
      # Match the 20 Hz controller so a newly marked obstacle is not held for
      # an additional 100 ms before committed-delay revalidation.
      update_frequency: 20.0
      # One snapshot per second is sufficient to associate every 0.5 Hz
      # candidate evaluation with its local costmap without affecting the
      # internal 20 Hz costmap update used by control.
      publish_frequency: 1.0
      resolution: 0.05
      width: 10
      height: 10
      # Known walls must be present before they enter the live sensor field of
      # view. Otherwise a static wall appears as a new voxel obstacle after a
      # candidate has already consumed its braking room, which can force Nav2's
      # NoValidControl zero despite an unchanged map and environment.
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      # Rectangle is the measured physical research footprint. Clearance
      # outside it is represented by the inflation gradient below.
      footprint: "[[-0.2, -0.3], [0.8, -0.3], [0.8, 0.3], [-0.2, 0.3]]"
      # Use the measured WHILL body rectangle as the hard planning boundary.
      # A previous 0.05 m padding marked the 1.5 m room entrance as lethal even
      # when the physical footprint was collision-free, rejecting every DWA
      # sample and causing PATIENCE_EXCEEDED.  Inflation still supplies a soft
      # clearance cost; physical-footprint collision remains a hard rejection.
      footprint_padding: 0.0
      inflation_layer:
        # Covers the rectangle's 0.854401 m circumscribed radius, so
        # footprint collision checks cannot be skipped from a free center cell.
        inflation_radius: 1.0
      voxel_layer:
        scan:
          # Keep newly observed Corridor posts out of the static map. The
          # 5 m robot-observable LiDAR horizon leaves planning time before the
          # 70 ms command FIFO and terminal-stop trajectory reach an obstacle.
          obstacle_max_range: 5.0
          raytrace_max_range: 5.5

global_costmap:
  global_costmap:
    ros__parameters:
      resolution: 0.05
      footprint: "[[-0.2, -0.3], [0.8, -0.3], [0.8, 0.3], [-0.2, 0.3]]"
      # Keep the global and local planning geometry identical so all research
      # Controllers compare against the same measured physical footprint.
      footprint_padding: 0.0
      # Corridor posts are deliberately local-LiDAR obstacles. Generated
      # global paths therefore remain independent of post observations.
      obstacle_layer:
        enabled: false
      inflation_layer:
        inflation_radius: 1.0

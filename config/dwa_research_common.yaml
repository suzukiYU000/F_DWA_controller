controller_server:
  ros__parameters:
    # Nav2 Controller Server's upstream default is 20 Hz. Keep every
    # comparison controller at this rate; the delayed robot-facing transport
    # has its own faster 33.333 Hz Timer.
    controller_frequency: 20.0
    enable_stamped_cmd_vel: false
    odom_topic: "/whill/odom"
    # Keep Nav2 Controller Server unmodified. The robot-facing transport owns
    # the 33.333 Hz Timer, preserves upstream commands in a bounded FIFO, and
    # validates FIFO-empty/applied-zero after the standard FollowPath result.
    publish_zero_velocity: true
    controller_plugins: ["FollowPath"]
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    FollowPath:
      debug_trajectory_details: true
      # Enter DWB's rotate-only phase inside the 0.25 m GoalChecker window.
      # This leaves room to restore translation after actuator-delay drift
      # without relaxing the pose accepted as goal success.
      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.01
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.2  # 0.6 for the initial real-robot limit
      max_vel_y: 0.0
      max_vel_theta: 1.57
      min_speed_xy: 0.0
      max_speed_xy: 1.2  # 0.6 for the initial real-robot limit
      min_speed_theta: 0.0
      acc_lim_x: 1.2
      acc_lim_y: 0.0
      acc_lim_theta: 1.57
      decel_lim_x: -1.2
      decel_lim_y: 0.0
      decel_lim_theta: -1.57
      vx_samples: 11
      vy_samples: 1
      # Use the same angular candidate count for every DWB-derived method.
      # Fifteen improves steering resolution without changing the upstream
      # generator algorithms or introducing a method-specific advantage.
      vtheta_samples: 15
      sim_time: 2.4
      discretize_by_time: true
      time_granularity: 0.05
      linear_granularity: 0.05
      angular_granularity: 0.025
      include_last_point: true
      enable_nominal_delay_preview: true
      nominal_delay_preview_seconds: 0.07
      # This is a robot-observable software dispatch event. It does not claim
      # knowledge of the internal motor actuation instant.
      command_dispatch_topic: "/controller/command_dispatch"
      transport_valid_topic: "/dwa_experiment/transport_valid"
      transport_invalidation_service: "/command_delay_transport/invalidate_trial"
      require_command_dispatch_state: true
      certification_control_period: 0.05
      terminal_stop_maximum_time: 8.0
      # The same capture magnitude applies to internally tracked acceleration
      # and F-DWA raw-input history before terminal state is cleared.
      terminal_stop_velocity_threshold: 0.01
      stop_capture_velocity: 0.01
      # Certification rounds this upward to complete 50 ms controller ticks
      # (70 ms -> 2 ticks) for every DWB-derived method.
      terminal_stop_command_delay_seconds: 0.07
      # This is an additional certificate reserve outside the common 0.10 m
      # planning footprint padding. Recovery from reserve intrusion is off by
      # default and will be implemented as a separate switchable policy.
      minimum_certified_margin: 0.02
      # At 0.05 m costmap resolution, checking at half-cell swept distance
      # prevents translation plus rectangle-corner rotation from skipping a cell.
      maximum_swept_distance: 0.025
      # Batch search keeps controller_server alive. Call this service once at
      # each run boundary; configured FIR coefficients are retained.
      trial_reset_service_name: "~/FollowPath/reset_trial_state"
      transform_tolerance: 0.2
      # All configured critic scores are non-negative. This only skips critic
      # work for candidates that cannot beat the best certified candidate.
      short_circuit_trajectory_evaluation: true
      # Keep canonical candidate order for the primary fair comparison.
      prefer_previous_selected_candidate: false
      # prefer_previous_selected_candidate: true  # performance-only ablation
      planning_metrics_enabled: true
      planning_metrics_report_interval: 1000
      planning_deadline_seconds: 0.05
      # Candidate evaluation is diagnostic output, not a control input.
      # Recording at 10 Hz preserves animation detail without serializing a
      # roughly 330 KiB evaluation message on every 50 ms control tick.
      publish_evaluation: true
      evaluation_publish_frequency: 10.0
      publish_trajectories: false
      stateful: true
      critics:
        - RotateToGoal
        - GoalAlign
        - PathAlign
        - PathDist
        - GoalDist
        # All earlier critic costs are non-negative. Expensive swept-footprint
        # scoring last lets the existing best-score short circuit reject most
        # noncompetitive candidates without changing the selected optimum.
        - ObstacleFootprint
      # Six-critic ground-truth corridor screening compared 0.10/0.15/0.20.
      # Endpoint clearance at 0.10 gave the longest rollout.
      ObstacleFootprint.scale: 0.10
      # Every pose is still checked for lethal/unknown cost. Keep the upstream
      # endpoint-score behavior so a longer rollout does not multiply soft
      # inflation cost and make stopping artificially preferable.
      ObstacleFootprint.sum_scores: false
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.325
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.class: "f_dwa_controller::HysteresisRotateToGoalCritic"
      RotateToGoal.slowing_factor: 5.0
      # Keep 0.03 m hysteresis against localization noise, but restore
      # translation at 0.23 m, before the 0.25 m GoalChecker boundary.
      # Set to -1.0 for the upstream Nav2 permanently latched behavior.
      RotateToGoal.xy_goal_tolerance_release_margin: 0.03
      # Score terminal-heading progress at the 1.25 s evaluation horizon.
      # The full 2.4 s rollout and the recursively feasible stop certificate
      # remain unchanged.
      RotateToGoal.lookahead_time: 1.25

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.2, 0.0, 1.57]  # [0.6, 0.0, 1.57] on the real robot
    min_velocity: [0.0, 0.0, -1.57]
    max_accel: [1.2, 0.0, 1.57]
    max_decel: [-1.2, 0.0, -1.57]
    odom_topic: "/whill/odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: false
    cmd_vel_in_topic: "cmd_vel_collision_unused_input"
    cmd_vel_out_topic: "cmd_vel_collision_unused"

local_costmap:
  local_costmap:
    ros__parameters:
      # Match the 20 Hz controller so a newly marked obstacle is not held for
      # an additional 100 ms before committed-delay revalidation.
      update_frequency: 20.0
      # Record the same snapshots used by the controller for failure analysis.
      publish_frequency: 10.0
      resolution: 0.05
      width: 10
      height: 10
      # Rectangle is the default research footprint. The 0.10 m padding is
      # the planning margin and is not treated as physical contact.
      footprint: "[[-0.2, -0.3], [0.8, -0.3], [0.8, 0.3], [-0.2, 0.3]]"
      footprint_padding: 0.10
      inflation_layer:
        # Covers the padded rectangle's 0.984886 m circumscribed radius, so
        # footprint collision checks cannot be skipped from a free center cell.
        inflation_radius: 1.0
      voxel_layer:
        scan:
          # Keep newly observed Corridor posts out of the static map. The
          # 5 m robot-observable LiDAR horizon leaves planning time before the
          # 70 ms command FIFO and terminal-stop trajectory reach an obstacle.
          obstacle_max_range: 5.0
          raytrace_max_range: 5.5

global_costmap:
  global_costmap:
    ros__parameters:
      resolution: 0.05
      footprint: "[[-0.2, -0.3], [0.8, -0.3], [0.8, 0.3], [-0.2, 0.3]]"
      footprint_padding: 0.10
      # Corridor posts are deliberately local-LiDAR obstacles. Generated
      # global paths therefore remain independent of post observations.
      obstacle_layer:
        enabled: false
      inflation_layer:
        inflation_radius: 1.0

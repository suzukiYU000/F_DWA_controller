controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # Match the common 20 Hz controller period and 2.4 s horizon.
      model_dt: 0.05
      time_steps: 48

      # Keep Nav2's representative MPPI sampling scale as the baseline.
      # batch_size: 1000  # Lower-compute change pattern
      batch_size: 2000
      iteration_count: 1
      regenerate_noises: false

      motion_model: "DiffDrive"
      vx_max: 1.2  # 0.6 for the initial real-robot limit
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 1.57
      ax_max: 1.2
      ax_min: -1.2
      ay_max: 0.0
      ay_min: 0.0
      az_max: 1.57
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      temperature: 0.3
      gamma: 0.015
      retry_attempt_limit: 1
      prune_distance: 3.0
      transform_tolerance: 0.2

      # Publish a representative 50/2000 candidate subset for headless
      # analysis. Candidate/time downsampling affects visualization only, not
      # optimization or the selected command. Use false for a timing ablation.
      visualize: true  # false
      TrajectoryVisualizer:
        trajectory_step: 40  # 20 publishes 100/2000 candidates
        time_step: 4  # 3 publishes 16/48 points per displayed candidate

      critics:
        - ConstraintCritic
        - CostCritic
        - GoalCritic
        - GoalAngleCritic
        - PathAlignCritic
        - PathFollowCritic
        - PathAngleCritic
        - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        consider_footprint: true
        collision_cost: 1000000.0
        critical_cost: 300.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        # Preserve translational recovery until the robot is safely inside the
        # 0.25 m GoalChecker window. This avoids a correct-yaw local minimum
        # just outside the goal after delayed-command overshoot.
        threshold_to_consider: 0.20
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

command_delay_transport:
  ros__parameters:
    use_sim_time: true
    input_topic: "cmd_vel_nav"
    output_topic: "/whill/controller/cmd_vel"
    applied_topic: "/controller/applied_cmd_vel"
    dispatch_topic: "/controller/command_dispatch"
    transport_valid_topic: "/dwa_experiment/transport_valid"
    transport_stopped_topic: "/dwa_experiment/transport_stopped"
    diagnostics_topic: "/diagnostics"
    reset_trial_service_name: "~/reset_trial_state"
    invalidate_trial_service_name: "~/invalidate_trial"
    emergency_stop_service_name: "~/emergency_stop"
    publish_frequency_hz: 33.333333333333333
    # Nav2 can deliver a slightly early callback and emits an immediate final
    # zero at goal. Preserve FIFO order here; the robot-facing Timer owns the
    # 30 ms minimum handoff interval and never performs catch-up publications.
    minimum_input_interval_ms: 0.0
    stopped_velocity_threshold: 0.01
    # Controller output -> post-Collision-Monitor command latency measured in
    # run_20260825_163606 and run_20260825_163730 was 35 ms median and
    # 24--53 ms at p05--p95. The 30 ms robot-facing Timer adds one scheduling
    # phase to this sampled delay; 5--35 ms here reproduces the observed
    # approximately 11--71 ms complete dispatch range.
    min_delay_ms: 5.0
    max_delay_ms: 35.0
    mean_delay_ms: 20.0
    delay_stddev_ms: 5.0
    # Apply the same post-dispatch dead-time plus first-order response used by
    # real-mode candidate activation. The filtered value goes to Gazebo while
    # applied_cmd_vel and CommandDispatch retain the actuator target.
    enable_velocity_response_model: true
    linear_velocity_response_dead_time_seconds: 0.035
    linear_velocity_response_time_constant_seconds: 0.02
    linear_velocity_response_gain: 1.0
    angular_velocity_response_dead_time_seconds: 0.015
    angular_velocity_response_time_constant_seconds: 0.085
    angular_velocity_response_gain: 0.95
    # Keep command quantization separate from the 0.01 m/s stop-capture tube.
    # F-8's first valid increment is smaller than 0.01 m/s.
    command_zero_threshold: 0.0
    # At a 20 Hz producer rate, at most two commands normally occupy the
    # bounded delay window. Gazebo /clock may briefly stop while wall-time
    # controller callbacks continue; 24 slots preserve FIFO order through
    # 1.0 s of bounded clock stall. Further growth remains a hard failure.
    max_queue_depth: 24
    random_seed: 0
